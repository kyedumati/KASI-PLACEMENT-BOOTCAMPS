rial, sans-serif" font-size="14" font-weight="400" fill="#E2E8F0" text-anchor="start">4 not seen. Store 5.</text><text x="52" y="243" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="middle">index 2</text><rect x="95" y="212" width="70" height="52" rx="10" fill="#1E2A55" stroke="#8FA8FF" stroke-width="2"/><text x="130" y="246" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#E2E8F0" text-anchor="middle">3</text><text x="290" y="244" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">9 - 3 = 6</text><rect x="400" y="212" width="220" height="52" rx="10" fill="#131B2E" stroke="#3B4863" stroke-width="1.5"/><text x="510" y="244" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#E2E8F0" text-anchor="middle">{1: 0, 5: 1}</text><text x="642" y="243" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#E2E8F0" text-anchor="start">6 not seen. Store 3.</text><text x="52" y="307" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#94A3B8" text-anchor="middle">index 3</text><rect x="95" y="276" width="70" height="52" rx="10" fill="#173B30" stroke="#6CC7A3" stroke-width="2"/><text x="130" y="310" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#E2E8F0" text-anchor="middle">8</text><text x="290" y="308" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="600" fill="#E2E8F0" text-anchor="middle">9 - 8 = 1</text><rect x="400" y="276" width="220" height="52" rx="10" fill="#173B30" stroke="#6CC7A3" stroke-width="2"/><