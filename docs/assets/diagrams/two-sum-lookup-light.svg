rial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">4 not seen. Store 5.</text><text x="52" y="243" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">index 2</text><rect x="95" y="212" width="70" height="52" rx="10" fill="#E8EDFB" stroke="#2447D4" stroke-width="2"/><text x="130" y="246" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">3</text><text x="290" y="244" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">9 - 3 = 6</text><rect x="400" y="212" width="220" height="52" rx="10" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/><text x="510" y="244" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">{1: 0, 5: 1}</text><text x="642" y="243" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A" text-anchor="start">6 not seen. Store 3.</text><text x="52" y="307" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">index 3</text><rect x="95" y="276" width="70" height="52" rx="10" fill="#E3F3EC" stroke="#2F8A68" stroke-width="2"/><text x="130" y="310" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="22" font-weight="700" fill="#0F172A" text-anchor="middle">8</text><text x="290" y="308" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="16" font-weight="600" fill="#0F172A" text-anchor="middle">9 - 8 = 1</text><rect x="400" y="276" width="220" height="52" rx="10" fill="#E3F3EC" stroke="#2F8A68" stroke-width="2"/><text x="510" y="308" font-family="'JetBrains Mono', Menlo, Consolas, 'Courier New', monospace" font-size="15" font-weight="600" fill="#0F172A" text-anchor="middle">{1: 0, 5: 1, 3: 2}</text><text x="642" y="307" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F8A68" text-anchor="start">1 is at index 0. Answer [0, 3]</text><text x="450" y="352" font-family="Inter, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B" text-anchor="middle">One pass. Each number is checked against the dictionary first, then stored.</text></svg>
